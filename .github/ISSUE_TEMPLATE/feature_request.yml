name: ✨ Feature Request
description: Suggest a new security detection rule, CLI feature, or integration
labels: ["feature", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      placeholder: What security gap or usability problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      placeholder: Describe your proposed detection mechanism, command, or feature
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      placeholder: Any alternative tools or approaches you've thought about?
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Nice to have
        - Should have
        - Must have
    validations:
      required: true
