name: 🐛 Bug Report
description: Report a bug or unexpected security detection behavior
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: Clear and concise description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run 'netsentry start'
        2. Execute '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Logs
      placeholder: Paste any relevant terminal logs or netsentry alert output
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low — cosmetic issue / CLI formatting
        - Medium — feature works but false positive alert
        - High — daemon crashes / detection failed
        - Critical — system network blocked incorrectly
    validations:
      required: true
